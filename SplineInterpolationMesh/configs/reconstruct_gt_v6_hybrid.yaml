# Hybrid reconstruction: lofted tubes + local SDF at complex bifurcations (aneurysms)

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_200depth_v6
  output_dir: SplineInterpolationMesh/output/gt_v6_hybrid

params:
  pattern: "*.npy"
  max_files: 5
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false
  output_ext: ".obj"

  method: hybrid
  target_spacing: 0.005
  n_ring_pts: 64

  # Hybrid-specific: classify bifurcations as complex when max/min radius > 1.3
  hybrid_complexity_threshold: 1.3
  # Local SDF patch: how many rings per segment to include
  hybrid_sdf_rings_range: 25
  # Local SDF grid resolution (per axis)
  hybrid_sdf_grid_resolution: 128
  # Smooth-min blending radius for SDF patches
  hybrid_sdf_smooth_k: 0.015

  # Local Laplacian smoothing for simple bifurcations
  bif_smooth_iterations: 30
  bif_smooth_radius_factor: 2.5
  bif_smooth_lambda: 0.5

  # Light global Taubin
  smooth_iterations: 5
  decimate_ratio: 0
