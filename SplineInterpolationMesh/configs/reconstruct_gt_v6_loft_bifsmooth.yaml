# Lofting reconstruction with local bifurcation smoothing (v6 raw kcount trees)

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_200depth_v6
  output_dir: SplineInterpolationMesh/output/gt_v6_loft_bifsmooth

params:
  pattern: "*.npy"
  max_files: 5
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false
  output_ext: ".obj"

  method: loft
  target_spacing: 0.005
  n_ring_pts: 64
  loft_cap_ends: true

  # Local bifurcation smoothing (only vertices near junctions)
  # radius_factor=3.5 ensures aneurysm bulges are fully covered
  bif_smooth_iterations: 50
  bif_smooth_radius_factor: 3.5
  bif_smooth_lambda: 0.5

  # Light global Taubin afterwards
  smooth_iterations: 5
  decimate_ratio: 0
