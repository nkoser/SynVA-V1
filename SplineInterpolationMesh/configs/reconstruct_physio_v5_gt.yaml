# Reconstruct meshes from Stage2_FlowMatching_Physio v5 GT trees

paths:
  input: /workspace/SynVA_V1/Stage2_FlowMatching_Physio/generated/physio_v5/npy
  output_dir: output/physio_v5_gt

params:
  pattern: "*_gt.npy"
  exclude_pattern: "*_local.npy"
  max_files: 0
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false
  output_ext: ".obj"

  method: poisson_perseg
  target_spacing: 0.005
  n_ring_pts: 64

  poisson_depth: 8
  poisson_n_cap_radial: 8
  poisson_repoisson: true
  poisson_repoisson_depth: 9
  poisson_repoisson_samples: 120000

  iso_remesh: true
  iso_remesh_factor: 2.0
  iso_remesh_iter: 3
  iso_taubin_iter: 30
