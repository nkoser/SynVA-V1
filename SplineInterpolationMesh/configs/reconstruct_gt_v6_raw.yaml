# Reconstruct meshes directly from v6 dense trees (raw kcount format, absolute coords)
# No normalization/relpos conversion needed — data is already absolute.

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_200depth_v6
  output_dir: SplineInterpolationMesh/output/gt_v6_raw_sdf_mc

params:
  pattern: "*.npy"
  max_files: 5                # quick test with a few files first
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false  # already in absolute coordinates
  output_ext: ".obj"

  # ── Interpolation ─────────────────────────────────────────────────
  target_spacing: 0.005
  n_ring_pts: 64

  # ── SDF + Marching-Cubes parameters ───────────────────────────────
  mc_resolution: 256
  mc_padding: 0.02
  mc_n_neighbors: 3
  mc_smooth_k: 0.01
  mc_level: 0.0
  mc_narrow_band_factor: 3.0
  mc_chunk_size: 200000
  sdf_smooth_sigma: 1.0
  sdf_erosion: 0.002

  # ── Post-processing ───────────────────────────────────────────────
  smooth_iterations: 10
  decimate_ratio: 0
