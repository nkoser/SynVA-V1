# Per-Segment Screened Poisson + Boolean Union — v9 trees (12 CPs per ring)

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_500depth_v9
  output_dir: output/gt_v9_poisson_perseg

params:
  pattern: "*.npy"
  max_files: 0
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false
  output_ext: ".obj"
  n_cp: 12

  method: poisson_perseg
  target_spacing: 0.005
  n_ring_pts: 64

  poisson_depth: 8
  poisson_n_cap_radial: 8
  poisson_repoisson: true
  poisson_repoisson_depth: 9
  poisson_repoisson_samples: 120000

  iso_remesh: true
  iso_remesh_factor: 2.0
  iso_remesh_iter: 3
  iso_taubin_iter: 30
