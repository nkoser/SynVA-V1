# Lofting reconstruction from v6 raw kcount trees (absolute coords)

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_200depth_v6
  output_dir: SplineInterpolationMesh/output/gt_v6_loft

params:
  pattern: "*.npy"
  max_files: 5
  overwrite: true
  skip_rotations: true
  convert_to_absolute: false
  output_ext: ".obj"

  method: loft
  target_spacing: 0.005
  n_ring_pts: 64
  loft_cap_ends: true

  smooth_iterations: 10
  decimate_ratio: 0
