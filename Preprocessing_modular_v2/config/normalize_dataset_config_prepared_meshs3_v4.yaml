# Feature normalization for prepared_meshes_3 split datasets.
# Mirrors norm_v4 behavior.

paths:
  train_dir: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_70depth_prepared/train
  val_dir: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_70depth_prepared/val
  test_dir: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_70depth_prepared/test

  output_root: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_70depth_prepared_norm_v4
  stats_path: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_70depth_prepared_norm_v4/normalization_stats.json

params:
  pattern: '*.npy'

  # robust_clip | maxabs_clip | zscore_clip | geometry_clip
  method: geometry_clip
  quantile: 99.9
  clip_value: 3.0

  # Leave k-token unchanged, normalize only continuous channels.
  feature_start: 1
  feature_end: null

  # Preserve geometric relations for xyz + spline control points.
  geometry_isotropic: true

  # v4: keep knot channels unchanged and unclipped.
  geometry_normalize_knots: false
  geometry_knots_quantile: 99.9

  preserve_root_zero_xyz: true
  root_position: first
  root_xyz_indices: [1, 2, 3]
  root_eps: 1e-8

  eps: 1e-6
  in_place: false
  overwrite: false
