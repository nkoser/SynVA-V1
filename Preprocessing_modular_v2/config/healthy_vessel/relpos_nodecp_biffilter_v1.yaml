# Convert biffilter_v1 normalized data to parent-relative positions
# + node-local control points (training input format).
paths:
  train_dir: /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm/train
  val_dir:   /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm/val
  test_dir:  /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm/test
  output_root:    /workspace/SynVA_V1/derived_data/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm_relpos_nodecp_v1
  metadata_path:  /workspace/SynVA_V1/derived_data/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm_relpos_nodecp_v1/local_geometry_metadata.json

params:
  pattern: "*.npy"
  overwrite: false
  position_slice: [1, 4]
  control_point_slices: [[4, 12], [12, 20], [20, 28]]
  relative_positions: true
  node_local_control_points: true
