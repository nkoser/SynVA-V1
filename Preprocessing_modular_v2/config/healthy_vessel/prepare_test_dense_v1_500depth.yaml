# Prepare dense healthy_vessel test split without rotations.

paths:
  input:  /workspace/SynVA_V1/derived_data/TreesSplines_k_count_500depth_healthy_dense_v1/test
  output: /workspace/SynVA_V1/derived_data/TreesSplines_k_count_500depth_healthy_dense_v1_prepared/test

params:
  k: 39
  mode: pre_order_kcount
  n_rotations: 1
  pattern: "*.npy"
  overwrite: false
  seed: 125
  spline_samples: 50
  spline_smooth: 0.0000001
  enable_rotation: false
  enable_scaling: false
  refit_splines: false
  add_structure_features: false
  structure_add_depth_norm: true
  structure_add_parent_delta_xyz: true
  structure_add_pathlen_root_norm: true
  structure_depth_cap: 150.0
  structure_pathlen_cap: 0.0
  structure_delta_scale: 1.0
  delta_xyz_parent: false
  delta_xyz_root_zero: true
  erase_output: false
