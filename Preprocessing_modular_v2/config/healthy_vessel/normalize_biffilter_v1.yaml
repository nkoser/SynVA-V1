# Normalize the biffilter_v1 dataset with the same v4-equivalent strategy
# used for healthy_vessel. Stats are recomputed on the filtered data so the
# distribution stays consistent.
paths:
  train_dir: /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1/train
  val_dir:   /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1/val
  test_dir:  /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1/test

  output_root: /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm
  stats_path:  /data/Output_healthy_vessel/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm/normalization_stats.json

params:
  pattern: "*.npy"

  method: geometry_clip
  quantile: 99.9
  clip_value: 3.0

  feature_start: 1
  feature_end: null

  geometry_isotropic: true
  geometry_normalize_knots: false
  geometry_knots_quantile: 99.9

  preserve_root_zero_xyz: true
  root_position: first
  root_xyz_indices: [1, 2, 3]
  root_eps: 1e-8

  eps: 1e-6
  in_place: false
  overwrite: false
