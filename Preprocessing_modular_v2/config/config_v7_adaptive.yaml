# v7 adaptive pipeline — radius-adaptive resampling for denser sampling
# at aneurysms (where radius changes rapidly) while keeping normal
# vessel segments at v6-comparable density.
#
# v6: step=0.04 uniform       → median 168 nodes, no adaptation
# v7: drds-adaptive 0.01-0.04 → denser at aneurysms, same elsewhere
#
# This re-runs resampling → splines → graphs_splines → trees_splines.
# Earlier steps (normalize, extract_centerlines) are reused from output_root.

paths:
  raw_root: '/data/prepared_meshes'
  output_root: '/data/Output_minimal_data_prepared_meshs3'

  # v7 outputs — keeps v6 data intact
  centerlines_resampled: '/data/Output_minimal_data_prepared_meshs3/centerlinesResampled_v7'
  centerlines_resampled_obj: '/data/Output_minimal_data_prepared_meshs3/centerlinesResampledOBJ_v7'
  splines_coef: '/data/Output_minimal_data_prepared_meshs3/splines_v7/coeficientes'
  splines_knots: '/data/Output_minimal_data_prepared_meshs3/splines_v7/knots'
  grafos_splines: '/data/Output_minimal_data_prepared_meshs3/grafosSplines_v7'
  trees_splines:  '/data/Output_minimal_data_prepared_meshs3/TreesSplines_v7'

params:
  raw_mesh_patterns:
    - '*/01_mesh/*.obj'
    - '*/01_Mesh/*.obj'
    - '*_models/*/surface/*.vtp'
  raw_mesh_datasets: ['aneux']
  raw_mesh_dataset_separator: '_'

  # ── Adaptive resampling: dense at radius changes, normal elsewhere ────────
  resample_method: step
  resample_step: 0.04              # fallback if no radius
  resample_use_radius: true        # ← KEY CHANGE: enable adaptive
  resample_base_step: 0.04         # normal step (same as v6)
  resample_step_min: 0.008         # minimum step at aneurysms
  resample_step_max: 0.04          # maximum step (= base)
  resample_radius_scale: 0.3       # scale factor
  resample_radius_mode: drds       # densify where dr/ds is large
  resample_drds_threshold: 0.05    # trigger above this dr/ds
  resample_drds_boost: 4.0         # ← aggressive densification
  # curvature densification (at bends)
  resample_curv_threshold: 3.0     # radians/length threshold
  resample_curv_boost: 1.0         # boost factor
  # junction densification
  resample_junction_window: 0.02   # window around bifurcations
  resample_junction_factor: 0.5    # step × 0.5 at junctions
  resample_junction_degree: 3
  # No hard cap — let adaptive choose freely
  resample_max_points_per_branch: null

  # ── Spline fitting (same as v5/v6) ────────────────────────────────────────
  spline_fit_mode: robust
  spline_fit_resample_only_if_needed: true
  spline_fit_min_points: 12
  spline_fit_resample: 128
  spline_fallback_recenter: true
  spline_fill_missing_with_nearest_valid: true
  spline_fit_canonical_start: false
  spline_fit_s: null
  spline_fit_s_scale: 0.01
  spline_fit_max_retries: 4
  spline_fit_retry_factor: 10.0

  normalize_overwrite: false

flags:
  copy_raw_data: false
  normalize_meshes: false
  extract_centerlines: false
  resample_centerlines: true    # ← re-run with adaptive method
  centerlines_to_obj: true
  vessels_to_obj: false
  radius_arrays: false
  splines: true                 # ← refit splines on denser centerlines
  graphs: false
  trees: false
  graphs_splines: true          # ← rebuild graphs
  trees_splines: true           # ← rebuild trees
