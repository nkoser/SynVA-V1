# Dataset preparation config

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_100depth/train
  output: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_100depth_prepared/train

params:
  k: 39
  mode: pre_order_kcount 
  n_rotations: 10
  pattern: "*.npy"
  overwrite: false
  seed: 125
  spline_samples: 50
  spline_smooth: 0.0000001
  enable_rotation: true
  enable_scaling: false
  refit_splines: false
  # Optional structure channels (appended to each node's attributes before reattaching k-token)
  # depth_norm, parent_delta_xyz, pathlen_root_norm
  add_structure_features: false
  structure_add_depth_norm: true
  structure_add_parent_delta_xyz: true
  structure_add_pathlen_root_norm: true
  structure_depth_cap: 150.0
  # <= 0 means auto-normalize by per-tree max path length
  structure_pathlen_cap: 0.0
  structure_delta_scale: 1.0
  # Optional xyz reparameterization: store xyz as delta to parent (k-modes only)
  delta_xyz_parent: false
  # If true, root delta is forced to zero during preprocessing
  delta_xyz_root_zero: true
  erase_output: true 
