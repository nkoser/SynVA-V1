# Train/val/test split for v7 (500depth adaptive-splines trees).
# Creates train/, val/, test/ subdirs inside the same folder.

paths:
  input:  /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_500depth_v7
  output: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_500depth_v7

params:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
  pattern: "*.npy"
  move: false
  stratify_by_length: true
  stratify_bins: 10
