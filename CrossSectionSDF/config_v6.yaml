# CrossSectionSDF — v6 TreeSplines (200 depth)
# Same k=39 format, more nodes (264 rows vs 101)

paths:
  input: /data/Output_minimal_data_prepared_meshs3/TreesSplines_k_count_200depth_v6_prepared/val
  output_dir: /data/roundtrip_test/meshes_xsdf_v6

params:
  k: 39
  pattern: "aneux_C0*.npy"
  max_files: null

  target_spacing: 0.003
  n_angular: 128

  sdf_step: 0.004
  smooth_k: 0.005
  k_neighbors: 5
  batch_slices: 40

  smooth_iterations: 20
  smooth_lambda: 0.5
  min_component_ratio: 0.01

  output_ext: ".obj"
  overwrite: true
