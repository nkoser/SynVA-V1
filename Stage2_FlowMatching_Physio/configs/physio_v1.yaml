# Flow Matching + Physiological Constraints v1
#
# Base: v8 (rel pos + radius loss) — BEST generation model
# New:  Murray's Law + bifurcation angle + radius tapering
#
# Murray's Law (γ=3): r_p³ = r_c1³ + r_c2³ at bifurcations
# Bifurcation angle:  penalize angles outside 50°–90° range
# Radius tapering:    child radius ≤ parent radius

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching_Physio/output/physio_v1
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  tree_attn_hops: 0
  self_conditioning: true

params:
  lr: 1.5e-4
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 600
  patience: 100
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

# Base v8 losses (kept identical)
loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  eccentricity_weight: 0.0

# NEW: Physiological constraint losses
physio:
  # Murray's Law: | r_p^γ - r_c1^γ - r_c2^γ | / r_p^γ
  murray_weight: 2.0
  murray_gamma: 3.0

  # Bifurcation angle: penalize |θ - target| > margin (soft hinge²)
  bifurcation_angle_weight: 1.0
  target_angle_deg: 70.0
  angle_margin_deg: 20.0

  # Radius tapering: max(0, r_child - r_parent) / r_parent
  tapering_weight: 1.0

  # Symmetry ratio: not used in v1 (start simple)
  symmetry_weight: 0.0
  symmetry_target: 0.8
  symmetry_margin: 0.2
