# Flow Matching + Physio v5 — trained on HEALTHY_VESSEL (no aneurysms).
#
# Data difference vs physio_v5 (v4 dataset):
#   - healthy_vessel meshes are decapped (aneurysm sacs removed) → far fewer
#     collapsed cross-section splines (~0.05% vs ~0.78% in v4)
#   - 3900 train / 390 val / 57 test (vs ~5420/560/60 in v4)
#
# Training from scratch: distribution differs from v4, so init_from v4 best
# would inject biases from aneurysm geometry. All physio losses (Murray,
# bifurcation angles, tapering, depth-radius) describe normal vasculature
# and apply equally — no need to disable any.

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_healthy_vessel_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_healthy_vessel_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching_Physio/output/physio_v5_healthy
  feature_stats: Stage2_FlowMatching/feature_stats_healthy.npz
  init_from: null

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  tree_attn_hops: 0
  self_conditioning: true
  depth_in_geometry: true

params:
  lr: 3.0e-4          # higher than 3e-5 since training from scratch
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 400
  patience: 80
  warmup_steps: 1000  # longer warmup for from-scratch
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  eccentricity_weight: 0.0

physio:
  murray_weight: 2.0
  murray_gamma: 3.0

  bifurcation_angle_weight: 1.0
  target_angle_deg: 120.0
  angle_margin_deg: 30.0

  tapering_weight: 1.0

  symmetry_weight: 1.0
  symmetry_target: 0.67
  symmetry_margin: 0.15

  sibling_cosine_weight: 3.0
  sibling_cosine_target: -0.5

  depth_radius_weight: 3.0
  depth_radius_target_decay: 0.95
