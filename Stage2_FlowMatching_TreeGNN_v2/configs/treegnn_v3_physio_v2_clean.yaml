# TreeGNN Flow Matching v3 — TreeGNN backbone + v11-style physio constraints.
#
# Combines:
#   - TreeFlowNet GNN backbone (10 message-passing layers, sparse global attn)
#   - logit-normal time sampling (peak at t=0.5; SD3/Flux convention)
#   - v6 cross-section continuity (circularity, normal-tangent, normal-smooth)
#   - GT-aligned physio constraints:
#       * NO Murray (over-corrects vs GT 0.83 baseline violation)
#       * Bif-angle target 120°±30°  (GT mean 119.2°)
#       * Sibling cosine target -0.5 (GT mean -0.45)
#       * NO tapering hard constraint (40% of GT edges violate r_c < r_p)
#       * Symmetry target 0.78±0.22 (GT median 0.77, covers 5–95% quantile)
#       * Depth-radius weight 0.5 with target_decay 1.05 (only catch explosions)
#
# Origin:
#   - Architecture     : Stage2_FlowMatching_TreeGNN/configs/treegnn_v1_v2_clean.yaml
#   - Loss / physio    : Stage2_FlowMatching_Physio/configs/physio_v11_v2_clean.yaml
#
# Trained from scratch on biffilter_v1; saves to Stage2_FlowMatching_TreeGNN_v2/.

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm_relpos_nodecp_v1/train
  val_dir:   derived_data/TreesSplines_k_count_100depth_prepared_biffilter_v1_norm_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching_TreeGNN_v2/output/treegnn_v3_physio_v2_clean
  feature_stats: Stage2_FlowMatching/feature_stats_healthy.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 256
  n_heads: 8
  n_layers: 10
  max_nodes: 256
  dropout: 0.1
  self_conditioning: true
  global_attn_every: 3

params:
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 64           # match v11 schedule (TreeGNN v1 used 32 — bumped here)
  batch_size_val: 64
  epochs: 400
  patience: 80
  warmup_steps: 1000
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: logit_normal
  time_logit_normal_mean: 0.0
  time_logit_normal_std: 1.0
  self_cond_prob: 0.5
  # v8 regularizers
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  # v6 cross-section continuity
  circularity_weight: 1.0
  normal_tangent_weight: 0.5
  normal_smooth_weight: 0.3

physio:
  murray_weight: 0.0
  murray_gamma: 3.0
  bifurcation_angle_weight: 1.0
  target_angle_deg: 120.0
  angle_margin_deg: 30.0
  tapering_weight: 0.0
  symmetry_weight: 1.0
  symmetry_target: 0.78
  symmetry_margin: 0.22
  sibling_cosine_weight: 3.0
  sibling_cosine_target: -0.5
  depth_radius_weight: 0.5
  depth_radius_target_decay: 1.05
