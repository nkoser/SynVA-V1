# TreeGNN v15 = v14_phys + v8 + v12 combined.
#
# Combines all the lessons learned in this short-runs ablation:
#
#  - v14_phys: target_angle_deg=50 (cerebral-corrected, vs broken 120 default)
#               + margin=20 → BifAngle should match GT 47° instead of 120°
#  - v8:        pos_focal_lambda=4 → Train-Loss champion's focal weighting
#               on continuation splines (rel_pos≈0)
#  - v12:       sibling_separation_weight=1.0, eps=0.5 → anti-curl-back
#               hinge loss at bifurcations (58% genus-0 meshes vs v8 46%)
#
# Plus the standard TreeGNN_v2 setup (cross-section continuity from v6,
# all physio constraints active per v11 recipe, depth-warp on).
#
# Hypothesis: this is the first model that should win on EVERY axis:
#   - low Train-Loss (focal pos)
#   - clean meshes (sibling_separation)
#   - correct BifAngle 47° not 120° (target_angle_deg=50)
#   - good Murray/Tapering/Symmetry (other physio constraints)

paths:
  train_dir: derived_data/TreesSplines_k_count_500depth_healthy_decap_dense_v1_prepared_biffilter_v2_norm_relpos_nodecp_v1/train
  val_dir:   derived_data/TreesSplines_k_count_500depth_healthy_decap_dense_v1_prepared_biffilter_v2_norm_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching_TreeGNN_v2/output/treegnn_v15_combined_short
  feature_stats: Stage2_FlowMatching/feature_stats_healthy_decap_dense_v2.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 512
  d_model: 256
  n_heads: 8
  n_layers: 10
  max_nodes: 384
  dropout: 0.1
  self_conditioning: true
  global_attn_every: 3
  depth_warp_alpha: 0.5

params:
  lr: 2.0e-4
  weight_decay: 0.01
  batch_size: 64
  batch_size_val: 32
  epochs: 400
  patience: 60
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 8
  rollout_interval: 50
  rollout_steps: 25
  rollout_samples: 2
  save_every: 50
  ema_decay: 0.999
  resume: true

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: logit_normal
  time_logit_normal_mean: 0.0
  time_logit_normal_std: 1.0
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  circularity_weight: 1.0
  normal_tangent_weight: 0.5
  normal_smooth_weight: 0.3
  # v8 — focal pos λ=4 (continuation splines)
  pos_focal_lambda: 4.0
  pos_focal_sigma: 1.0
  # v12 — sibling-separation hinge (anti-curl-back)
  sibling_separation_weight: 1.0
  sibling_separation_eps: 0.5

physio:
  murray_weight: 0.0
  murray_gamma: 3.0
  bifurcation_angle_weight: 1.0
  target_angle_deg: 50.0      # v14_phys — corrected for cerebral (Zamir 1999)
  angle_margin_deg: 20.0
  tapering_weight: 0.0
  symmetry_weight: 1.0
  symmetry_target: 0.78
  symmetry_margin: 0.22
  sibling_cosine_weight: 3.0
  sibling_cosine_target: -0.5
  depth_radius_weight: 0.5
  depth_radius_target_decay: 1.05
