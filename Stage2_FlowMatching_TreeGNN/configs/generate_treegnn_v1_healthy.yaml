paths:
  checkpoint: Stage2_FlowMatching_TreeGNN/output/treegnn_v1_healthy/best_model.pt
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_healthy_vessel_relpos_nodecp_v1/test
  feature_stats: Stage2_FlowMatching/feature_stats_healthy.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 256
  n_heads: 8
  n_layers: 10
  max_nodes: 256
  self_conditioning: true
  global_attn_every: 3

params:
  n_samples: 100
  n_steps: 100
  seed: 42
  device: 0
  use_ema: true
  solver: euler
  time_schedule: linear
  velocity_scale: 1.0
  rp_damp: 0.75
  output_dir: Stage2_FlowMatching_TreeGNN/generated/treegnn_v1_healthy
