# Physio-Guided Sampling v1: Physio v4 checkpoint + inference-time guidance
# Switch between modes: change sampling_mode to "normal" or "guided"

paths:
  checkpoint: Stage2_FlowMatching_Physio/output/physio_v4/best_model.pt
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  tree_attn_hops: 0
  self_conditioning: true

params:
  n_steps: 100
  n_samples: 60
  seed: 42
  device: 0
  output_dir: Stage2_FlowMatching/generated/guided_v1
  use_ema: true
  # ─── Switch this between "normal" and "guided" ───
  sampling_mode: guided

# ─── Physio guidance config (only active when sampling_mode=guided) ───
guidance:
  # Guidance strength λ — how much the physio gradient corrects the velocity
  strength: 0.1
  # Time window for guidance [t_min, t_max].
  # Earlier (near noise) = less meaningful gradients.
  # Later (near clean) = sharper, more accurate corrections.
  t_min: 0.3
  t_max: 0.95
  # Schedule: "linear" (ramp up), "cosine" (bell-shaped), "constant"
  schedule: linear
  # Max gradient norm per node (prevents explosion)
  grad_clip: 1.0

  # ─── Physio loss weights (same interface as training losses) ───
  murray_weight: 1.0
  murray_gamma: 3.0
  sibling_cosine_weight: 5.0
  sibling_cosine_target: -0.5
  depth_radius_weight: 2.0
  depth_radius_target_decay: 0.95
  bifurcation_angle_weight: 0.0
  tapering_weight: 0.0
  symmetry_weight: 0.0
