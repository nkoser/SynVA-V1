# Physio-Guided Sampling v2: v8 Baseline checkpoint + inference-time guidance
# Test: Can we steer a vanilla baseline toward physio-correctness at inference?
# Switch between modes: change sampling_mode to "normal" or "guided"

paths:
  checkpoint: Stage2_FlowMatching/output/flow_v8/best_model.pt
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  tree_attn_hops: 0
  self_conditioning: true

params:
  n_steps: 100
  n_samples: 60
  seed: 42
  device: 0
  output_dir: Stage2_FlowMatching/generated/guided_v2
  use_ema: true
  # ─── Switch this between "normal" and "guided" ───
  sampling_mode: guided

# ─── Physio guidance config ───
guidance:
  strength: 0.15
  t_min: 0.3
  t_max: 0.95
  schedule: linear
  grad_clip: 1.0

  murray_weight: 1.0
  murray_gamma: 3.0
  sibling_cosine_weight: 5.0
  sibling_cosine_target: -0.5
  depth_radius_weight: 2.0
  depth_radius_target_decay: 0.95
  bifurcation_angle_weight: 0.0
  tapering_weight: 0.0
  symmetry_weight: 0.0
