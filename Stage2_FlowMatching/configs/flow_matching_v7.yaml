# Flow Matching v7 — radius loss (log-space MSE on RMS cross-section radius)
# Key changes from v6:
#   - radius_weight: 3.0  →  explicit penalty on cross-section size errors.
#     Computes RMS radius of 8 CPs in estimated clean data x̂_1 and penalizes
#     (log(r_hat) - log(r_target))² per node.  Scale-invariant: equally
#     penalizes 50% shrinkage regardless of vessel size.
#   - Addresses the size-dependent radius shrinkage problem:
#       GT [0.10,0.50) → 0.42× (without radius loss)
#       GT [0.02,0.04) → 0.92× (without radius loss)
#   - Same architecture as v6 (d384/10L/8H, self-conditioning, EMA)
#   - Same absolute positions as v6

data:
  absolute_positions: true

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching/output/flow_v7
  feature_stats: Stage2_FlowMatching/feature_stats_abspos.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  tree_attn_hops: 0
  self_conditioning: true

params:
  lr: 1.5e-4
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 600
  patience: 100
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
