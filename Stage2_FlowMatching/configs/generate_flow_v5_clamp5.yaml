# Generation config for Flow Matching v5 (z-score normalized + clamping)
paths:
  checkpoint: Stage2_FlowMatching/output/flow_v5/best_model.pt
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  tree_attn_hops: 0
  self_conditioning: true
  input_clamp_value: 5.0

params:
  n_steps: 100
  n_samples: 20
  seed: 42
  device: 0
  output_dir: Stage2_FlowMatching/generated/flow_v5_clamp5
  use_ema: true
