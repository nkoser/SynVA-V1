# Flow Matching v8 — relative positions + radius loss
# Combines v5's good normal alignment (relative positions) with
# v7's radius-accuracy improvement (log-space radius loss).
#
# Key findings motivating this config:
#   - v5 (rel):  best normal alignment (0.778 mean |dot|, 25% < 0.7)
#                 but radius shrinkage (median 0.624×)
#   - v7 (abs+radius): best radius (median 0.947×)
#                 but terrible normal alignment (0.522, 67% < 0.7)
#                 because abs-mode direction SNR = 0.105 (random)
#   - v8 = rel + radius_loss → should get both right

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching/output/flow_v8
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  tree_attn_hops: 0
  self_conditioning: true

params:
  lr: 1.5e-4
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 600
  patience: 100
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
