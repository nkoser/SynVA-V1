# Flow Matching v10 — rel pos + radius loss + Gram-matrix shape loss
# Builds on v8 (best model). Replaces v9's SVD eccentricity loss with
# a Gram-matrix loss:  ||C_hat^T C_hat - C_gt^T C_gt||_F^2 / ||C_gt^T C_gt||_F^2
#
# Why Gram instead of SVD?
#   - SVD backward has terms 1/(σ_i² - σ_j²) → gradient explosion when
#     singular values are close (near-circular cross-sections, ~50% of data)
#   - Gram-matrix loss is everywhere smooth and differentiable
#   - Captures both aspect ratio AND orientation without explicit decomposition
#
# v10 = v8 + eccentricity_weight=3.0 (Gram loss)
# (Lower weight than v9's 5.0 because relative Gram loss has different scale)

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  output_dir: Stage2_FlowMatching/output/flow_v10
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  tree_attn_hops: 0
  self_conditioning: true

params:
  lr: 1.5e-4
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 600
  patience: 100
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 8
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  eccentricity_weight: 3.0
