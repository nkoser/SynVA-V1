# Healthy vessel GT vs generated mesh comparison via point-cloud embeddings.
#
# This config is ready for code preparation. Generated mesh roots can stay empty
# until the reconstructions are available.

experiment:
  name: healthy_vessel_foundation_tsne
  output_dir: HealthyVesselFoundationTSNE/output/healthy_vessel_foundation_tsne

data:
  # GT sources. The first matching mesh per case is used.
  gt_mesh_roots:
    - /data/healthy_vessel_decapped
    - /data/healthy_vessel

  # Fill as generated meshes become available, for example:
  # generated_mesh_roots:
  #   physio_v5: /data/Stage2_FlowMatching_Physio/generated/physio_v5/meshes_sweep
  #   treegnn_v2_abspos: /workspace/SynVA_V1/SplineInterpolationMesh/output/healthy_treegnn_v2
  generated_mesh_roots: {}

  file_extensions: [".obj", ".ply", ".stl", ".off"]
  include_regex:
  exclude_regex_gt:
  exclude_regex_generated: "(_gt|_gt_local|_local)$"
  paired_only: true
  max_cases:

pointcloud:
  points_per_mesh: 4096
  sample_method: surface
  normalize: unit_sphere
  seed: 42
  cache_dir: pointclouds
  overwrite_cache: false

embedding:
  # Use geometric_baseline for smoke tests only. For the final figure, switch to
  # uni3d, openshape, michelangelo, or external_npz.
  backend: geometric_baseline
  batch_size: 16
  device: cuda
  cache_file: embeddings.npz
  overwrite_cache: false
  l2_normalize: true

  # Option A: consume embeddings generated by a separate foundation-model script.
  external_npz:

  # Option B: one callable for any custom model. Signature:
  #   callable(points_np, backend_config, device) -> embeddings_np
  custom_callable:
  custom_repo_path:

  # Option C: named backends with their own repo/checkpoint/callable.
  uni3d:
    repo_path: /data/foundation_models/Uni3D
    callable: HealthyVesselFoundationTSNE.backbones.uni3d_adapter:embed_point_clouds
    checkpoint: /data/foundation_models/Uni3D_weights/modelzoo/uni3d-g/model.pt
    model_name: create_uni3d
    scale: giant
    num_points: 10000
    rgb: [0.4, 0.4, 0.4]
    use_pointnet2_fallback: true
    force_pointnet2_fallback: true
    patch_dropout: 0.0
    args: {}

  openshape:
    # Official OpenShape package/repo. If `import openshape` already works,
    # repo_path can stay empty.
    repo_path:
    callable: HealthyVesselFoundationTSNE.backbones.openshape_adapter:embed_point_clouds
    checkpoint:
    model_name: openshape-pointbert-vitg14-rgb
    num_points: 10000
    rgb: [0.4, 0.4, 0.4]

  michelangelo:
    # Michelangelo releases differ. Use either factory_callable, config_path, or
    # model_module + model_class.
    repo_path:
    callable: HealthyVesselFoundationTSNE.backbones.michelangelo_adapter:embed_point_clouds
    checkpoint:
    model_name:
    num_points: 8192
    input_channels: 6
    normal_fill: [0.0, 0.0, 1.0]
    factory_callable:
    config_path:
    model_module:
    model_class:
    model_kwargs: {}
    encode_methods: [encode_shape_embed, encode, encode_pc, forward]

tsne:
  perplexity: 30
  init: pca
  learning_rate: auto
  metric: euclidean
  random_state: 42
  max_iter: 1000
  standardize: false

plot:
  filename: healthy_vessel_foundation_tsne.png
  dpi: 220
  point_size: 34
  draw_pair_lines: true
