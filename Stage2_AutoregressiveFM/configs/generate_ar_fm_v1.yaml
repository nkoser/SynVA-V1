# Generation config for Autoregressive Tree FM v1
paths:
  checkpoint: Stage2_AutoregressiveFM/output/ar_fm_v1/best_model.pt
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  self_conditioning: true

params:
  n_samples: 20
  n_steps: 50          # ODE steps per level
  seed: 42
  device: 0
  use_ema: true
  rp_damp: 0.75
  velocity_scale: 1.0
  output_dir: Stage2_AutoregressiveFM/generated/ar_fm_v1
