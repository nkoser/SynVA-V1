# Autoregressive Tree Flow Matching v1
#
# Novel approach: generate tree nodes LEVEL-BY-LEVEL in BFS order.
# Each depth level is denoised via Flow Matching, conditioned on
# already-generated ancestor levels (clean features).
#
# Architecture:
#   - Same Transformer as v8 (d384/10L/8H, ~20M params)
#   - Level-causal attention mask: nodes can only see depth <= frontier
#   - Node state embedding: ancestor (clean) / frontier (noisy) / future (masked)
#
# Training:
#   - Sample random frontier level L per tree
#   - Ancestors get clean features, frontier gets noisy, future masked
#   - Loss only on frontier-level nodes
#
# Inference:
#   - Generate root → children → grandchildren → ... level by level
#   - Each level: 50 ODE steps conditioned on clean ancestors

paths:
  train_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/train
  val_dir: derived_data/TreesSplines_k_count_100depth_prepared_norm_v4_relpos_nodecp_v1/val
  output_dir: Stage2_AutoregressiveFM/output/ar_fm_v1
  feature_stats: Stage2_FlowMatching/feature_stats.npz

model:
  geom_dim: 39
  k_classes: 3
  max_depth: 128
  d_model: 384
  n_heads: 8
  n_layers: 10
  d_ff: 1536
  max_nodes: 256
  dropout: 0.1
  self_conditioning: true

params:
  lr: 2.0e-4
  weight_decay: 0.01
  batch_size: 32
  batch_size_val: 32
  epochs: 600
  patience: 100
  warmup_steps: 500
  seed: 42
  device: 0
  num_workers: 4
  rollout_interval: 25
  rollout_steps: 50
  rollout_samples: 4
  save_every: 50
  ema_decay: 0.999
  resume: false

loss:
  pos_weight: 1.0
  cp_weight: 1.0
  knots_weight: 1.0
  time_sampling: uniform
  self_cond_prob: 0.5
  knot_mono_weight: 0.5
  planarity_weight: 1.0
  radius_weight: 3.0
  frontier_sampling: uniform
